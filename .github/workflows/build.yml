name: OpenWrt Builder

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target device (all = build all devices)'
        required: false
        type: choice
        default: uf02
        options:
          - all
          - uz801
          - uf02

env:
  UPLOAD_FIRMWARE: true
  TZ: Europe/Madrid

jobs:
  resolve-version:
    runs-on: ubuntu-24.04
    outputs:
      openwrt_version: ${{ steps.resolve.outputs.version }}
    steps:
    - name: Resolve stable OpenWrt tag
      id: resolve
      run: |
        echo "version=v25.12.6" >> $GITHUB_OUTPUT

  build:
    needs: resolve-version
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJSON((inputs.device == 'all' || inputs.device == '') && '["uz801","uf02"]' || format('["{0}"]', inputs.device)) }}

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        
        # Robust update layer to stop exit code 100 mirror loops
        sudo apt-get update -qq || true
        
        # Force-install absolute baseline compiler dependencies directly
        sudo apt-get install -y -qq --no-install-recommends \
          build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget subversion patch
          
        # Execute secondary dependencies script ONLY if it exists, ignoring fallback errors cleanly
        if [ -f "./devenv/dependencies.sh" ]; then
          sudo chmod +x ./devenv/dependencies.sh
          sudo DEBIAN_FRONTEND=noninteractive ./devenv/dependencies.sh || true
        fi
        
        sudo apt-get -qq autoremove --purge -y
        sudo apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"

    - name: Clone OpenWrt source code
      run: |
        git clone https://openwrt.org openwrt
        git -C openwrt checkout ${{ needs.resolve-version.outputs.openwrt_version }}

    - name: Load msm89xx target and packages
      run: |
        [ -f "apply_patches.sh" ] && chmod +x apply_patches.sh && ./apply_patches.sh openwrt || true
        [ -d "msm89xx" ] && mv msm89xx openwrt/target/linux/msm89xx || true
        [ -d "packages" ] && mv packages openwrt/package/msm8916 || true

    - name: Update and install feeds
      run: |
        cd openwrt
        rm -rf tmp
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load diffconfig
      run: |
        DEVICE="${{ matrix.device }}"
        DIFFCONFIG="diffconfig_${DEVICE}"
        if [ -f "$DIFFCONFIG" ]; then
          mv "$DIFFCONFIG" openwrt/.config
        elif [ -f "diffconfigs/${DEVICE}/${DEVICE}.config" ]; then
          cp "diffconfigs/${DEVICE}/${DEVICE}.config" openwrt/.config
        fi

    - name: Download package
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec rm -f {} \; || true

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        make -j$(nproc) || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        echo "FILE_DATE=$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/msm89xx/generic
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: openwrt_firmware_${{ matrix.device }}
        path: |
          ${{ env.FIRMWARE }}/*-gpt_both0.bin
          ${{ env.FIRMWARE }}/*-boot.img
          ${{ env.FIRMWARE }}/*-system.img
          ${{ env.FIRMWARE }}/*.manifest
