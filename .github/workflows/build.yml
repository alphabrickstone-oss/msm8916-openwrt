name: OpenWrt Builder

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target device (all = build all devices)'
        required: false
        type: choice
        default: uf02
        options:
          - all
          - uz801
          - uf02

env:
  UPLOAD_FIRMWARE: true
  TZ: Europe/Madrid

jobs:
  build:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJSON((inputs.device == 'all' || inputs.device == '') && '["uz801","uf02"]' || format('["{0}"]', inputs.device)) }}

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo apt-get update -qq
        
        sudo apt-get install -y -qq --no-install-recommends \
          build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses5-dev libssl-dev python3-setuptools rsync unzip zlib1g-dev file wget subversion patch
          
        sudo DEBIAN_FRONTEND=noninteractive ./devenv/dependencies.sh
        
        sudo apt-get -qq autoremove --purge -y
        sudo apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"

    - name: Clone OpenWrt source code
      run: |
        echo "Using OpenWrt v25.12.6"
        git clone https://git.openwrt.org/openwrt/openwrt.git
        git -C openwrt checkout v25.12.6


    - name: Load msm89xx target and packages
      run: |
        ./apply_patches.sh openwrt
        mv msm89xx openwrt/target/linux/msm89xx
        mv packages openwrt/package/msm8916


    - name: Update and install feeds
      run: |
        cd openwrt
        rm -rf tmp
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load diffconfig
      run: |
        DEVICE="${{ matrix.device }}"
        DIFFCONFIG="diffconfig_${DEVICE}"
        if [ -f "$DIFFCONFIG" ]; then
          mv "$DIFFCONFIG" openwrt/.config
        elif [ -f "diffconfigs/${DEVICE}/${DEVICE}.config" ]; then
          cp "diffconfigs/${DEVICE}/${DEVICE}.config" openwrt/.config
        else
          echo "Error: no diffconfig found for ${DEVICE}"
          exit 1
        fi
        sed -i '/CONFIG_PACKAGE_openvswitch/d' openwrt/.config
        sed -i '/CONFIG_PACKAGE_kmod-openvswitch/d' openwrt/.config

    - name: Download package
      id: package
      run: |
        cd openwrt
        make defconfig
        case "${{ matrix.device }}" in
          uf02) profile=generic-uf02 ;;
          uz801) profile=yiming-uz801v3 ;;
          *) echo "Error: unsupported device '${{ matrix.device }}'"; exit 1 ;;
        esac
        grep -qx "CONFIG_TARGET_msm89xx_msm8916_DEVICE_${profile}=y" .config || {
          echo "Error: expected target profile ${profile} was not selected"
          exit 1
        }
        make download -j8
        find dl -size -1024c -exec rm -f {} \;
    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        yes "" |make kernel_oldconfig
        make -j$(nproc) || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT


    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        TARGET_DIR=$(find openwrt/bin/targets/msm89xx -mindepth 1 -maxdepth 1 -type d | head -n 1)
        if [ -z "$TARGET_DIR" ]; then
          echo "Error: No target output directory was built. Check 'Compile the firmware' logs above."
          exit 1
        fi
        cd "$TARGET_DIR"
        rm -rf packages
        echo "firmware=$PWD" >> "$GITHUB_OUTPUT"
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware
      uses: actions/upload-artifact@v6
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: openwrt_firmware_${{ matrix.device }}
        path: ${{ steps.organize.outputs.firmware }}/


